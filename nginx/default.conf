# Reverse proxy for Strapi (69-s1-cybersec)
# Mounted at /etc/nginx/conf.d/default.conf, so this file lives in the
# `http` context: limit_req_zone / log_format / resolver are all valid here.
#
# Rate limiting on password endpoints (brute-force protection).
limit_req_zone $binary_remote_addr zone=auth_local:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_admin:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=password:10m   rate=2r/m;

# Rejected requests answer 429 (not the nginx default 503).
limit_req_status 429;
limit_req_log_level warn;

# Docker's embedded DNS. Required because proxy_pass below uses a variable,
# which makes nginx resolve the name per request instead of at startup.
resolver 127.0.0.11 valid=30s ipv6=off;

log_format auth_audit '$remote_addr - [$time_local] '
                      '"$request_method $request_uri" $status '
                      'req=$request_time body=$request_length';

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    access_log /var/log/nginx/access.log auth_audit;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 10m;

    set $upstream http://app:1337;

    # --- Security headers ---
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header Referrer-Policy          "no-referrer"                  always;
    add_header X-XSS-Protection         "0"                            always;

    # --- User auth endpoints (rate-limited) ---
    location = /api/auth/local {
        limit_req zone=auth_local burst=5 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/local/register {
        limit_req zone=auth_local burst=5 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/forgot-password {
        limit_req zone=password burst=3 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/auth/reset-password {
        limit_req zone=password burst=3 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin auth endpoints (rate-limited) ---
    location = /admin/login {
        limit_req zone=auth_admin burst=5 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin/forgot-password {
        limit_req zone=password burst=3 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin/reset-password {
        limit_req zone=password burst=3 nodelay;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else ---
    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

services:
  db:
    image: postgres
    container_name: 69-s2-db
    restart: always
    environment:
      POSTGRES_USER: natthapong
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: natthapong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: natthapong-w@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8082:80"
    depends_on:
      - db

volumes:
  postgres_data:

services:
  db:
    image: postgres:16
    container_name: 69-s2-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: <REDACTED>}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: <REDACTED>}
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    restart: always
    depends_on:
      - db
    ports:
      - "9092:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: <REDACTED>}
      APP_KEYS: <REDACTED>}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: <REDACTED>}
      JWT_SECRET: <REDACTED>}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
    volumes:
      - strapi_data:/opt/app

volumes:
  postgres_data:
  pgadmin_data:
  strapi_data:
